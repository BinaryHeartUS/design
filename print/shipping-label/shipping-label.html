@page { size: 4in 6in; margin: 0 }
html, body { margin: 0; padding: 0 }
@media screen { html { background: #9AA6B8 } body { padding: 24px 0 } .label { margin: 0 auto; box-shadow: 0 4px 24px rgba(0,0,0,.2) } }
@media print { .label { zoom: 0.64 } }
[contenteditable]:hover { outline: 1px dashed #9AA6B8; outline-offset: 2px }
[contenteditable]:focus { outline: 2px solid #FF0040; outline-offset: 2px }
@media print { [contenteditable] { outline: none !important } }

.label { width: 600px; height: 900px; box-sizing: border-box; background: #FFFFFF; border: 3px solid #2F4A70; padding: 3px;
  display: flex; flex-direction: column; font-family: 'Lato', 'Helvetica Neue', Arial, sans-serif; overflow: hidden }
.head { height: 97px; box-sizing: border-box; border-bottom: 3px solid #2F4A70; display: flex; align-items: center; gap: 14px; padding: 0 22px 3px }
.head img { width: 58px; height: 58px; object-fit: contain }
.lockup { flex: 1; display: flex; flex-direction: column; gap: 3px }
.wm { font-size: 32px; line-height: 32px; font-weight: 700; color: #2F4A70 }
.wm .h { color: #FF0040 }
.tag { font-size: 10px; font-weight: 700; letter-spacing: 1px; color: #000000 }
.url { font-size: 11px; font-weight: 700; color: #2F4A70 }
.red { height: 4px; background: #FF0040; flex-shrink: 0 }

.sender { height: 232px; box-sizing: border-box; background: #F5F6F8; border-bottom: 20px solid #2F4A70; text-align: center; padding-top: 20px; flex-shrink: 0 }
.chip { display: inline-block; color: #FFFFFF; font-weight: 700; text-transform: uppercase; white-space: nowrap }
.sender .chip { background: #2F4A70; font-size: 16px; letter-spacing: 3px; padding: 6px 17px 6px 20px; line-height: 19.5px }
.sender .org { margin-top: 12px; font-size: 26px; font-weight: 700; color: #2F4A70; line-height: 31px }
.sender .who { margin-top: 3px; font-size: 24px; font-weight: 700; color: #555555; line-height: 28.5px }
.sender .addr { margin-top: 3px; font-size: 22px; font-weight: 400; color: #777777; line-height: 30.8px }

.deliver { flex: 1; text-align: center; padding-top: 87px; box-sizing: border-box }
.deliver .chip { background: #FF0040; font-size: 18px; letter-spacing: 4px; padding: 7px 20px 7px 24px; line-height: 22px }
.deliver .org { margin-top: 16px; font-size: 42px; font-weight: 900; color: #2F4A70; line-height: 46.2px }
.deliver .who { margin-top: 13px; font-size: 38px; font-weight: 700; color: #333333; line-height: 46px }
.deliver .addr { margin-top: 10px; font-size: 34px; font-weight: 400; color: #444444; line-height: 44.2px }

.care { height: 45.5px; box-sizing: border-box; background: #F5F6F8; border-top: 2px solid #2F4A70; text-align: center; padding-top: 13px;
  font-size: 13px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase; color: #2F4A70; flex-shrink: 0 }
.foot { height: 39.5px; box-sizing: border-box; background: #2F4A70; text-align: center; padding-top: 14px;
  font-size: 10px; font-weight: 400; letter-spacing: 2px; text-transform: uppercase; color: #FFFFFF; flex-shrink: 0 }
</style>
